name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov ruff mypy pre-commit
          playwright install --with-deps chromium

      - name: Run ruff lint
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run mypy
        run: mypy --ignore-missing-imports src/

      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=25

      - name: Run safety scan
        run: |
          pip install safety
          safety check || true

      - name: Generate SBOM
        run: |
          pip freeze > sbom.txt
          echo "sbom.txt>>$GITHUB_OUTPUT" >> sbom.txt

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.txt

      - name: Build Docker image
        run: docker build -t mvp-browser-agent .
