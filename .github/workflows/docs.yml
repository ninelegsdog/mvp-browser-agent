name: Docs Deploy

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate markdown
        # markdownlint-cli2 — npm-пакет; pip его не устанавливает.
        # Правила и исключения заданы в .markdownlint-cli2.jsonc.
        run: npx --yes markdownlint-cli2 '**/*.md'
